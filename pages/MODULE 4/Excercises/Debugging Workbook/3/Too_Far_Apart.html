    1. Reduce the visible gap between the cards to approximately 20px.
    2. Keep 20px of padding inside each card.
    3. Explain which property controls the gap outside each card.
    4. Explain why reducing padding is not the correct first fix.
 Answer:
    Because your command was to reduce the gap between the cards to approximately 20px, 
    The property that controls the gap outside each card is the margin. Reducing padding will only reduce the space that is inside the card, not the space between the cards.
