<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Exercise 1 - fix the crowded product card</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="product-card">
            <h2>Wireless Headphones</h2>
            <p class="price">Price: ₱1,500</p>
            <p>Comfortable headphones for everyday use.</p>
            <button>Buy Now</button>
        </div>
    </body>
</html>

<!--
    Without changing the HTML:
        1. Give .product-card a width of 300px.
        2. Add 20px of padding.
        3. Add a 1px solid #cccccc border.
        4. Add 15px of margin around the card.
        5. Give the heading a bottom margin of 10px.
        6. Give the button padding of 10px.
        7. Give the card a background color of your choice.
-->
