<!--    
        Exercise 8 — Mini-project: Profile Card Collection
            Instructions:

                Card 1 — Basic profile
                Set the width, padding, border, and margin. Style the heading and paragraph using selectors.

                Card 2 — Different spacing
                Use different padding and margins from Card 1. Give it a different border thickness.

                Card 3 — Box-sizing
                Use box-sizing: border-box and make the card's total width equal to its declared width.

                Rules
                - No Flexbox or Grid.
                - No positioning.
                - Use external CSS.
                - Use class selectors to style the cards.
                - Use the box model properties covered in the exercises.
                - Explain the purpose of each padding, margin, and border declaration.
                Answer:
                width: Sets the width of the content area of the card.
                padding: Creates space between the content and the border of the card.
                margin: Creates space around the card.
                border: Creates a border around the card.
-->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Profile Card Collection</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="profile-cards-container">
            <div class="card card1">
                <h2>John Smith</h2>
                <p>Web Developer</p>
            </div>
            <div class="card card2">
                <h2>Jane Doe</h2>
                <p>Graphic Designer</p>
            </div>
            <div class="card card3">
                <h2>Emily Johnson</h2>
                <p>UI/UX Designer</p>
            </div>
        </div>
    </body>
</html>
